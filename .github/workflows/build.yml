name: Build Windows installer

on:
  release:
    types: [published]    # publish a release on GitHub (e.g. tag v1.0.0) to build and attach the installer
  push:
    branches: [main]      # every push to main is built too (download it from the run's Artifacts)
    tags: ["v*"]
  workflow_dispatch:      # or run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests -q

      - name: Work out version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V=$(python -c "import livemods;print(livemods.__version__)"); fi
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Build app (PyInstaller)
        run: pyinstaller --noconfirm 360LiveMods.spec

      - name: Smoke test - the built exe loads its game definitions
        shell: bash
        run: |
          test -f dist/360LiveMods/_internal/livemods/games/fable2.json
          test -f dist/360LiveMods/_internal/assets/fonts/ChakraPetch-SemiBold.ttf
          ./dist/360LiveMods/360LiveMods.exe --list

      - name: Build installer (Inno Setup)
        shell: bash
        run: |
          choco install innosetup -y --no-progress || true
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" //DAppVersion=${{ steps.ver.outputs.version }} installer/360LiveMods.iss

      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist/360LiveMods/* -DestinationPath "360LiveMods-Portable-${{ steps.ver.outputs.version }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: 360LiveMods-${{ steps.ver.outputs.version }}
          path: |
            installer/Output/*.exe
            360LiveMods-Portable-*.zip

      - name: Attach files to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            installer/Output/*.exe
            360LiveMods-Portable-*.zip
